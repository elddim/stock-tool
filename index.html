<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>錢錢股票商店</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background: #fffaf0;
      color: #333;
    }

    header {
      background: linear-gradient(135deg, #fff3ad, #ffd76a);
      text-align: center;
      padding: 38px 20px;
    }

    header h1 {
      margin: 5px 0;
      font-size: 36px;
    }

    header p {
      color: #725a17;
    }

    .container {
      max-width: 950px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 26px;
      margin-bottom: 25px;
      box-shadow: 0 8px 28px rgba(0,0,0,.07);
    }

    .money {
      text-align: center;
      font-size: 60px;
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%,100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-8px);
      }
    }

    .center {
      text-align: center;
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 13px;
      font-size: 17px;
      outline: none;
    }

    input:focus {
      border-color: #ffc83d;
    }

    .budget {
      max-width: 350px;
      margin: 15px auto;
    }

    .budget input {
      border: 2px solid #ffd76a;
      text-align: center;
      font-size: 24px;
    }

    .search-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
    }

    button {
      border: none;
      border-radius: 13px;
      cursor: pointer;
      font-size: 16px;
      transition: .2s;
    }

    .yellow-btn {
      padding: 13px 22px;
      background: #ffd76a;
      font-weight: bold;
    }

    .yellow-btn:hover {
      background: #ffc83d;
      transform: translateY(-2px);
    }

    #status {
      margin-top: 15px;
      color: #777;
      line-height: 1.6;
    }

    .stock-result {
      display: none;
      margin-top: 22px;
      padding: 22px;
      border-radius: 20px;
      background: #fff9dc;
    }

    .stock-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .tag {
      display: inline-block;
      background: #ffd76a;
      padding: 5px 11px;
      border-radius: 20px;
      font-size: 13px;
    }

    .tag.otc {
      background: #d9efff;
    }

    .stock-code {
      margin-top: 10px;
      font-size: 32px;
      font-weight: bold;
    }

    .stock-name {
      margin-top: 4px;
      color: #777;
      font-size: 19px;
    }

    .price-box {
      min-width: 190px;
      padding: 16px 22px;
      background: white;
      border-radius: 18px;
    }

    .price-title {
      color: #888;
      font-size: 13px;
    }

    .price {
      margin: 5px 0;
      font-size: 32px;
      font-weight: bold;
    }

    .date {
      font-size: 12px;
      color: #999;
    }

    .market-data {
      display: grid;
      grid-template-columns: repeat(4,1fr);
      gap: 10px;
      margin-top: 20px;
    }

    .market-box {
      padding: 13px;
      background: white;
      border-radius: 14px;
    }

    .market-label {
      color: #999;
      font-size: 12px;
    }

    .market-value {
      margin-top: 5px;
      font-weight: bold;
    }

    .buy-section {
      margin-top: 22px;
      padding-top: 20px;
      border-top: 1px dashed #d3bd62;
    }

    .preview {
      margin: 12px 0;
      padding: 15px;
      background: white;
      border-radius: 13px;
      line-height: 1.7;
    }

    .cart-btn {
      width: 100%;
      padding: 14px;
      background: #ffd76a;
      font-weight: bold;
    }

    .cart-btn:hover {
      background: #ffc83d;
    }

    .cart-item {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 15px;
      align-items: center;
      padding: 16px 0;
      border-bottom: 1px solid #eee;
    }

    .cart-name {
      font-size: 18px;
      font-weight: bold;
    }

    .cart-detail {
      margin-top: 5px;
      color: #777;
      font-size: 14px;
    }

    .remove-btn {
      background: #ffe5e5;
      color: #a83030;
      padding: 8px 12px;
    }

    .empty {
      text-align: center;
      color: #999;
      padding: 25px;
      line-height: 1.8;
    }

    .summary {
      margin-top: 20px;
      padding: 20px;
      border-radius: 18px;
      background: #fff9dc;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin: 10px 0;
    }

    .summary-row.big {
      padding-top: 13px;
      border-top: 1px dashed #d0b858;
      font-size: 22px;
      font-weight: bold;
    }

    .money-message {
      margin-top: 20px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      line-height: 1.6;
    }

    .money-face {
      display: block;
      font-size: 48px;
    }

    .notice {
      text-align: center;
      color: #888;
      font-size: 13px;
      line-height: 1.8;
      padding: 5px 10px 40px;
    }

    @media(max-width:700px) {
      .search-row {
        grid-template-columns: 1fr;
      }

      .market-data {
        grid-template-columns: repeat(2,1fr);
      }

      .cart-item {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <div style="font-size:48px;">
    🪙✨
  </div>

  <h1>
    錢錢股票商店
  </h1>

  <p>
    上市、上櫃都可以逛 🛍️
  </p>
</header>


<div class="container">

  <div class="card center">

    <div class="money">
      🪙
    </div>

    <h2>
      我的錢錢
    </h2>

    <div class="budget">
      <input
        id="budget"
        type="number"
        value="100000"
        min="0"
        oninput="updateCart()"
      >
    </div>

    <div style="color:#777;">
      輸入這次想拿多少錢錢買股票
    </div>

  </div>


  <div class="card">

    <h2>
      🔎 找股票
    </h2>

    <label>
      股票代號
    </label>

    <div class="search-row">

      <input
        id="stockCode"
        type="text"
        placeholder="例如：2330、6488"
        onkeydown="if(event.key==='Enter') searchStock()"
      >

      <button
        class="yellow-btn"
        onclick="searchStock()"
      >
        🔍 找股票
      </button>

    </div>

    <div id="status">
      🪙 可以搜尋上市或上櫃股票
    </div>


    <div
      id="stockResult"
      class="stock-result"
    >

      <div class="stock-header">

        <div>

          <span
            id="marketTag"
            class="tag"
          >
            🇹🇼 上市
          </span>

          <div
            id="resultCode"
            class="stock-code"
          ></div>

          <div
            id="resultName"
            class="stock-name"
          ></div>

        </div>


        <div class="price-box">

          <div class="price-title">
            最新可取得收盤價
          </div>

          <div
            id="resultPrice"
            class="price"
          ></div>

          <div
            id="resultDate"
            class="date"
          ></div>

        </div>

      </div>


      <div class="market-data">

        <div class="market-box">
          <div class="market-label">
            開盤價
          </div>

          <div
            id="openingPrice"
            class="market-value"
          ></div>
        </div>


        <div class="market-box">
          <div class="market-label">
            最高價
          </div>

          <div
            id="highestPrice"
            class="market-value"
          ></div>
        </div>


        <div class="market-box">
          <div class="market-label">
            最低價
          </div>

          <div
            id="lowestPrice"
            class="market-value"
          ></div>
        </div>


        <div class="market-box">
          <div class="market-label">
            漲跌
          </div>

          <div
            id="change"
            class="market-value"
          ></div>
        </div>

      </div>


      <div class="buy-section">

        <label>
          💰 這檔想花多少錢錢？
        </label>

        <input
          id="investAmount"
          type="number"
          min="0"
          placeholder="例如：30000"
          oninput="previewBuy()"
        >

        <div
          id="preview"
          class="preview"
        >
          輸入金額，錢錢會幫你算可以買幾股 ✨
        </div>

        <button
          class="cart-btn"
          onclick="addToCart()"
        >
          🛒 放進股票袋袋
        </button>

      </div>

    </div>

  </div>


  <div class="card">

    <h2>
      🛒 我的股票袋袋
      <span id="cartCount">
        0
      </span>
    </h2>

    <div id="cartItems">

      <div class="empty">
        袋袋目前空空的 🛍️
        <br>
        去找一檔喜歡的股票吧！
      </div>

    </div>


    <div class="summary">

      <div class="summary-row">
        <span>
          💰 我的預算
        </span>

        <strong id="summaryBudget">
          $100,000
        </strong>
      </div>


      <div class="summary-row">
        <span>
          🛍️ 已選股票
        </span>

        <strong id="summarySpent">
          $0
        </strong>
      </div>


      <div class="summary-row big">
        <span>
          🪙 錢包剩下
        </span>

        <span id="summaryRemain">
          $100,000
        </span>
      </div>

    </div>


    <div
      id="moneyMessage"
      class="money-message"
    >

      <span class="money-face">
        🪙✨
      </span>

      錢錢準備好囉！

    </div>

  </div>


  <div class="notice">
    本網站為股票資金試算工具。
    <br>
    上市資料來自 TWSE，上櫃資料來自 TPEx。
    <br>
    使用最新可取得收盤價進行試算，
    並非券商盤中即時逐筆報價。
    <br>
    未包含手續費、交易稅等交易成本。
  </div>

</div>


<script>

  const STOCK_API =
    "/api/stock";


  let currentStock =
    null;


  let cart =
    [];


  function moneyFormat(number) {

    return "$" +
      Math.round(number)
        .toLocaleString("zh-TW");

  }


  function parsePrice(value) {

    if (
      value === undefined ||
      value === null
    ) {
      return 0;
    }


    const cleaned =
      String(value)
        .replace(/,/g, "")
        .replace(/--/g, "")
        .trim();


    const number =
      Number(cleaned);


    return Number.isNaN(number)
      ? 0
      : number;

  }


  async function searchStock() {

    const code =
      document
        .getElementById("stockCode")
        .value
        .trim()
        .toUpperCase();


    const status =
      document.getElementById(
        "status"
      );


    const result =
      document.getElementById(
        "stockResult"
      );


    if (!code) {

      status.innerHTML =
        "🥹 要先輸入股票代號喔～";

      result.style.display =
        "none";

      return;
    }


    status.innerHTML =
      "🪙 錢錢正在上市＋上櫃一起找..." ;


    result.style.display =
      "none";


    try {

      const response =
        await fetch(
          STOCK_API,
          {
            cache: "no-store"
          }
        );


      if (!response.ok) {

        throw new Error(
          "API HTTP " +
          response.status
        );

      }


      const data =
        await response.json();


      if (!Array.isArray(data)) {

        console.log(data);

        throw new Error(
          "API 回傳格式錯誤"
        );

      }


      const stock =
        data.find(item =>

          String(
            item.code || ""
          )
            .trim()
            .toUpperCase()
          ===
          code

        );


      if (!stock) {

        currentStock =
          null;


        status.innerHTML = `

          😢 找不到

          <strong>
            ${code}
          </strong>

          <br>

          <small>
            目前查詢上市與上櫃公開資料。
          </small>

        `;


        return;

      }


      const price =
        parsePrice(
          stock.closingPrice
        );


      if (
        !price ||
        price <= 0
      ) {

        status.innerHTML = `

          ⚠️ 找到

          <strong>
            ${stock.code}
            ${stock.name}
          </strong>

          ，但目前沒有可使用的收盤價。

        `;

        return;
      }


      currentStock = {

        market:
          stock.market,

        code:
          stock.code,

        name:
          stock.name,

        price:
          price,

        date:
          stock.date,

        openingPrice:
          stock.openingPrice || "-",

        highestPrice:
          stock.highestPrice || "-",

        lowestPrice:
          stock.lowestPrice || "-",

        change:
          stock.change || "-"

      };


      const tag =
        document.getElementById(
          "marketTag"
        );


      if (
        currentStock.market ===
        "上櫃"
      ) {

        tag.textContent =
          "🇹🇼 上櫃";

        tag.className =
          "tag otc";

      } else {

        tag.textContent =
          "🇹🇼 上市";

        tag.className =
          "tag";

      }


      document.getElementById(
        "resultCode"
      ).textContent =
        currentStock.code;


      document.getElementById(
        "resultName"
      ).textContent =
        currentStock.name;


      document.getElementById(
        "resultPrice"
      ).textContent =
        moneyFormat(
          currentStock.price
        );


      document.getElementById(
        "resultDate"
      ).textContent =
        currentStock.date
          ? "資料日期：" +
            currentStock.date
          : "最新可取得資料";


      document.getElementById(
        "openingPrice"
      ).textContent =
        currentStock.openingPrice;


      document.getElementById(
        "highestPrice"
      ).textContent =
        currentStock.highestPrice;


      document.getElementById(
        "lowestPrice"
      ).textContent =
        currentStock.lowestPrice;


      document.getElementById(
        "change"
      ).textContent =
        currentStock.change;


      document.getElementById(
        "investAmount"
      ).value =
        "";


      document.getElementById(
        "preview"
      ).innerHTML =
        "輸入金額，錢錢會幫你算可以買幾股 ✨";


      status.innerHTML = `

        ✨ 找到啦！

        <strong>
          ${currentStock.code}
          ${currentStock.name}
        </strong>

        ・${currentStock.market}

      `;


      result.style.display =
        "block";


    } catch(error) {

      console.error(error);


      currentStock =
        null;


      result.style.display =
        "none";


      status.innerHTML = `

        😭 錢錢取得股票資料失敗。

        <br>

        <small>
          ${error.message}
        </small>

      `;

    }

  }


  function previewBuy() {

    if (!currentStock) {
      return;
    }


    const amount =
      Number(
        document.getElementById(
          "investAmount"
        ).value
      );


    const preview =
      document.getElementById(
        "preview"
      );


    if (
      !amount ||
      amount <= 0
    ) {

      preview.innerHTML =
        "輸入金額，錢錢會幫你算可以買幾股 ✨";

      return;

    }


    const shares =
      Math.floor(
        amount /
        currentStock.price
      );


    if (
      shares <= 0
    ) {

      preview.innerHTML =
        "🥹 這筆錢目前還買不到 1 股。";

      return;

    }


    const cost =
      shares *
      currentStock.price;


    const remain =
      amount -
      cost;


    preview.innerHTML = `

      ✨ 約可以買

      <strong>
        ${shares.toLocaleString("zh-TW")}
        股
      </strong>

      <br>

      實際使用

      <strong>
        ${moneyFormat(cost)}
      </strong>

      <br>

      這筆預算剩

      <strong>
        ${moneyFormat(remain)}
      </strong>

    `;

  }


  function addToCart() {

    if (!currentStock) {

      alert(
        "請先找股票 🪙"
      );

      return;
    }


    const amount =
      Number(
        document.getElementById(
          "investAmount"
        ).value
      );


    if (
      !amount ||
      amount <= 0
    ) {

      alert(
        "先輸入想花多少錢錢～"
      );

      return;
    }


    const shares =
      Math.floor(
        amount /
        currentStock.price
      );


    if (
      shares <= 0
    ) {

      alert(
        "這筆金額還買不到 1 股喔！"
      );

      return;
    }


    const cost =
      shares *
      currentStock.price;


    const existing =
      cart.find(
        item =>
          item.code ===
          currentStock.code
      );


    if (existing) {

      existing.shares +=
        shares;

      existing.cost +=
        cost;

    } else {

      cart.push({

        market:
          currentStock.market,

        code:
          currentStock.code,

        name:
          currentStock.name,

        price:
          currentStock.price,

        shares:
          shares,

        cost:
          cost

      });

    }


    document.getElementById(
      "investAmount"
    ).value =
      "";


    document.getElementById(
      "preview"
    ).innerHTML =
      "🛍️✨ 成功放進股票袋袋！";


    updateCart();

  }


  function removeCart(index) {

    cart.splice(
      index,
      1
    );


    updateCart();

  }


  function updateCart() {

    const budget =
      Number(
        document.getElementById(
          "budget"
        ).value
      ) || 0;


    const totalSpent =
      cart.reduce(
        (sum,item) =>
          sum + item.cost,
        0
      );


    const cartItems =
      document.getElementById(
        "cartItems"
      );


    if (
      cart.length === 0
    ) {

      cartItems.innerHTML = `

        <div class="empty">

          袋袋目前空空的 🛍️

          <br>

          去找一檔喜歡的股票吧！

        </div>

      `;

    } else {

      cartItems.innerHTML =
        cart.map(

          (item,index) => `

            <div class="cart-item">

              <div>

                <div class="cart-name">

                  ${item.code}

                  ${item.name}

                </div>

                <div class="cart-detail">

                  ${item.market}
                  ・

                  ${item.shares.toLocaleString("zh-TW")}
                  股

                  ×

                  ${moneyFormat(item.price)}

                </div>

              </div>


              <strong>

                ${moneyFormat(item.cost)}

              </strong>


              <button
                class="remove-btn"
                onclick="removeCart(${index})"
              >

                移除

              </button>

            </div>

          `

        ).join("");

    }


    const remain =
      budget -
      totalSpent;


    document.getElementById(
      "cartCount"
    ).textContent =
      cart.length;


    document.getElementById(
      "summaryBudget"
    ).textContent =
      moneyFormat(budget);


    document.getElementById(
      "summarySpent"
    ).textContent =
      moneyFormat(totalSpent);


    document.getElementById(
      "summaryRemain"
    ).textContent =
      moneyFormat(remain);


    updateMoneyFace(
      budget,
      remain
    );

  }


  function updateMoneyFace(
    budget,
    remain
  ) {

    const message =
      document.getElementById(
        "moneyMessage"
      );


    if (
      remain < 0
    ) {

      message.innerHTML = `

        <span class="money-face">
          😭💸
        </span>

        錢錢不夠啦！

        <br>

        超出

        ${moneyFormat(
          Math.abs(remain)
        )}

      `;

      return;

    }


    if (
      budget <= 0
    ) {

      message.innerHTML = `

        <span class="money-face">
          🪙
        </span>

        先輸入今天有多少錢錢～

      `;

      return;

    }


    const ratio =
      remain /
      budget;


    if (
      ratio >= 0.7
    ) {

      message.innerHTML = `

        <span class="money-face">
          🪙✨
        </span>

        錢包還胖胖的，可以繼續逛！

      `;

    } else if (
      ratio >= 0.4
    ) {

      message.innerHTML = `

        <span class="money-face">
          😊🪙
        </span>

        買了一些，錢錢還很有精神！

      `;

    } else if (
      ratio >= 0.15
    ) {

      message.innerHTML = `

        <span class="money-face">
          😳🪙
        </span>

        錢錢開始變瘦了，要注意預算！

      `;

    } else {

      message.innerHTML = `

        <span class="money-face">
          🥹💰
        </span>

        錢錢快見底啦！

      `;

    }

  }


  updateCart();

</script>

</body>
</html>
